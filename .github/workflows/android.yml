
name: Build Kerala KTM Rider

on:
  workflow_dispatch:
  push:
    paths:
      - 'kerala_ktm_rider_android_starter.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3

      - name: Prepare project
        run: |
          unzip -q kerala_ktm_rider_android_starter.zip
          cd kerala_ktm_rider_android
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd kerala_ktm_rider_android/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Kerala-KTM-Rider-APK
          path: kerala_ktm_rider_android/android/app/build/outputs/apk/debug/app-debug.apk
